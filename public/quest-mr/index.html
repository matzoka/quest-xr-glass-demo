<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Quest XR 地球デモ</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="hud">
      <section class="panel">
        <div class="titleRow">
          <h1>Quest XR 地球デモ</h1>
          <span class="versionBadge" aria-label="App version">v2026.09.29.26</span>
        </div>
        <p id="status">地球を準備中…</p>
        <div class="actions">
          <button class="actionButton" id="vrButton" type="button">Enter VR</button>
          <button class="actionButton secondary" id="arButton" type="button">Enter AR</button>
        </div>
        <div class="actions demoActions" aria-label="Demo controls">
          <button class="actionButton demo" id="enterpriseOrbitButton" type="button">Enterprise 周回</button>
          <button class="actionButton demo klingon" id="klingonButton" type="button">クリンゴン登場</button>
          <button class="actionButton demo blackHole" id="blackHoleTourButton" type="button">ブラックホール探訪</button>
          <button class="actionButton demo taxiAnalytics" id="taxiAnalyticsButton" type="button" hidden>タクシー業務アプリ分析</button>
          <button class="actionButton demo help" id="controllerHelpButton" type="button">操作HELP</button>
        </div>
        <textarea id="poseDebugOutput" class="poseDebugOutput" readonly hidden aria-label="Pose debug URL"></textarea>
      </section>
      <section class="panel taxiChatPanel" id="taxiChatPanel" hidden data-taxi-feature>
        <div class="taxiChatHeader">
          <span>AI 分析アシスタント</span>
          <span class="taxiSampleBadge">サンプルデータ</span>
          <button class="taxiSettingsBtn" id="taxiSettingsBtn" type="button" title="LLM設定">⚙</button>
        </div>
        <div class="taxiChatMessages" id="taxiChatMessages"></div>
        <div class="taxiChatInput">
          <input type="text" id="taxiChatInput" placeholder="質問を入力（例：売上は？）" autocomplete="off" />
          <button class="taxiMicBtn" id="taxiMicBtn" type="button" title="音声入力">🎤</button>
          <button class="taxiSendBtn" id="taxiSendBtn" type="button">送信</button>
        </div>
        <div class="taxiQuickQuestions">
          <button class="taxiQuickBtn" data-question="月別の売上推移を出して">月別売上</button>
          <button class="taxiQuickBtn" data-question="曜日別の乗車回数を見せて">曜日別</button>
          <button class="taxiQuickBtn" data-question="車両ごとの稼働率比較">車両別</button>
          <button class="taxiQuickBtn" data-question="どの一覧表を出せますか？">一覧</button>
          <button class="taxiQuickBtn taxiClearBtn" data-action="clear-chat" title="チャット履歴と作成したパネルをクリア">クリア</button>
        </div>
      </section>
    </main>
    <div class="modalOverlay" id="taxiSettingsModal" hidden data-taxi-feature>
      <div class="modalContent">
        <h2>LLM バックエンド設定</h2>
        <p class="modalNote">オプション：OpenAI互換エンドポイントを設定すると、より自然な会話ができます。設定しない場合はオフラインモード（インテントマッチング）で動作します。</p>
        <p class="modalWarning">⚠ APIキーはブラウザのlocalStorageに保存され、設定したエンドポイントにのみ送信されます。このリポジトリには送信されません。</p>
        <label class="modalLabel">
          エンドポイントURL
          <input type="url" id="llmEndpoint" placeholder="https://api.openai.com/v1/chat/completions" />
        </label>
        <div class="modalLabel">
          <label for="llmApiKey">APIキー</label>
          <div style="display: flex; gap: 6px; align-items: center; margin-top: 4px">
            <input type="text" id="llmApiKey" placeholder="sk-..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="margin-top: 0; flex: 1; min-width: 0; font-family: ui-monospace, Menlo, Consolas, monospace" />
            <button type="button" id="llmApiKeyToggle" aria-pressed="true" aria-controls="llmApiKey" style="flex: none; padding: 8px 10px; white-space: nowrap">非表示</button>
          </div>
          <p id="llmApiKeyHint" aria-live="polite" style="margin: 4px 0 0; font-size: 12px; font-weight: 400; color: #ffcc88; white-space: pre-line"></p>
        </div>
        <label class="modalLabel">
          モデル（オプション）
          <input type="text" id="llmModel" placeholder="gpt-4o-mini" />
        </label>
        <label class="modalLabel">
          音声認識
          <select id="llmSttEngine">
            <option value="whisper" selected>Whisper（Cloudflare）</option>
            <option value="mimo">mimo（OpenCode）</option>
          </select>
        </label>
        <label class="modalLabel">
          mimo用 音声認識モデル（オプション）
          <input type="text" id="llmSttModel" placeholder="mimo-v2.5（OpenCode Go、録音をAIで文字起こし）" />
        </label>
        <div class="modalActions">
          <button id="llmSaveBtn" type="button">保存</button>
          <button id="llmClearBtn" type="button" class="secondary">クリア</button>
          <button id="llmCloseBtn" type="button" class="secondary">閉じる</button>
        </div>
        <p class="modalStatus" id="llmStatus"></p>
      </div>
    </div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./app.js?v=2026.09.29.26"></script>
  </body>
</html>
